<body>

  <nav class="menu">

      <li><a href="index.html">HOME</a></li>

      <li class="agora"><a href="#">CADASTRO</a></li>
      <li><a href="login.html">LOGIN</a></li>
    </ul>
  </nav>
  <section id="cadastro">



    <div class="cadastro-container">
      <div class="box-cadastro">
        <h2>CADASTRE-SE</h2>
        <label>
          <span>Nome:</span> <br>
          <input type="text" id="input_nome" placeholder="  Digite seu nome...">
        </label>
        <label>
          <span>Sobrenome:</span> <br>
          <input type="text" id="input_sobrenome" placeholder="  Digite seu sobrenome...">
        </label>
        <label>
          <span>E-mail:</span> <br>
          <input type="text" id="input_email" placeholder="  Digite seu email...">
        </label>
        <label>
          <span>Senha:</span> <br>
          <input type="text" id="input_senha" placeholder="  Digite uma senha...">
        </label>
        <label>
          <span>Confirme a Senha:</span> <br>
          <input type="text" id="input_confirmacao_senha" placeholder="  Confirme sua senha...">
        </label>

        <button class="botao" onclick="cadastrar()">Cadastrar</button>

        <div id="div_aguardar" class="loading-div">
          <img src="./assets/img/soundwave-23744_256.gif" id="loading-gif">
        </div>

        <div id="div_erros_login"></div>

        <div class="alerta_erro">
          <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
          </div>
        </div>

        <p>Já tem cadastro, clique em <a href="login.html">Entrar</a></p>
      </div>
      <img src="assets/img/ChatGPT Image Nov 14, 2025, 01_20_07 AM.png" alt="">

    </div>
    </div>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  // let listaEmpresasCadastradas = [];

  function cadastrar() {
    aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = input_nome.value;
    var sobrenomeVar = input_sobrenome.value;
    var emailVar = input_email.value;
    var senhaVar = input_senha.value;
    var confirmacaoSenhaVar = input_confirmacao_senha.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      sobrenomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      confirmacaoSenhaVar != senhaVar
    ) {
      cardErro.style.opacity = 1;

      mensagem_erro.innerHTML =
        "Campos em branco e/ou incorretos";


      return false;
    } else {

      setInterval(sumirMensagem, 2000)
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        sobrenomeServer: sobrenomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar

      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        div_aguardar.style.opacity = 1;
        if (resposta.ok) {
          
          div_aguardar.style.opacity = 1;
          mensagem_erro.innerHTML =
          "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          div_aguardar.style.opacity = 1;
          
          setTimeout(() => {
            div_aguardar.style.opacity = 1;
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });
    return false;
  }



  function sumirMensagem() {
    cardErro.style.display = "none"
  }

</script>
