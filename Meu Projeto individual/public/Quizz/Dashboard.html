<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="assets/img/ChatGPT Image Nov 5, 2025, 02_36_17 PM.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <script src="../js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/44fdb15698.js" crossorigin="anonymous"></script>

    <title>Frequency Culture</title>
</head>

<body onload="validarSessao()">
    <nav class="menu-lateral">
        <h1>FREQUENCY CULTURE</h1>
        <ul>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span> !</h3>
            </div>

            <div class="box-lateral">
                <li><a href="QUIZ.html"><i class="fa-solid fa-dice"></i>JOGAR</a></li>
            </div>

            <div class="box-lateral">
                <li class="agora"><a href="Dashboard.html"><i class="fa-solid fa-chart-simple"></i>RESULTADOS</a></li>
            </div>

            <div class="box-lateral-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </ul>
    </nav>
    <div class="fundo">
        <header class="header-container">

            <h2>Dashboard</h2>

            <section class="indicador-quiz">

                <div class="indicador-kpi">

                    <div class="campo">
                        <h4>Questões certas</h4> <br>
                        <div id="div_quest_certas">***</div>
                    </div>
                    <div class="campo">
                        <h4>Questões erradas</h4> <br>
                        <div id="div_quest_erradas">***</div>
                    </div>
                    <div class="campo">
                        <h4>Total de Questões</h4> <br>
                        <div id="div_qtd_Questoes">***</div>
                    </div>
                    <div class="campo">
                        <h4>Percentual</h4> <br>
                        <div id="div_percentual">***</div>
                    </div>
                </div>

            </section>
        </header>
        <main class="main-container">

            <section class="graph-container">

                <div class="graph-quiz">
                    <canvas id="myChart"></canvas>
                </div>

            </section>
            <section class="ranking-container">
                <h3>Histórico resultados</h3>   
                <div id="div_ranking"></div>
            </section>

        </main>
        <footer>

        </footer>
    </div>
</body>


</html>
<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    const idUsuario = sessionStorage.ID_USUARIO;


    var valores = [];

    var tentativa = '';

    var msgKpis = [];

    var rankingAcerto = [];
    var rankingErros = [];

    let nomeUsuario = sessionStorage.NOME_USUARIO;


    const ctx = document.getElementById('myChart');

    // Trocar para valores dos Ids das Tentativas
    let labelsX = ['Acertos', 'Erros'];


    var grafico1 = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labelsX,
            datasets: [{
                label: nomeUsuario,
                data: valores,
                borderWidth: 2,
                borderColor: 'blueviolet',
                backgroundColor: 'blueviolet',
                color: '#4a006c'
            }]
        },
        options: {
            labels: {
                fontStyle: 'bold'
            },
            plugins: {
                title: {
                    display: true,
                    color: 'white',
                    text: 'Ultimos resultados',
                    font: {
                        weight: 600,
                        size: 18
                    }
                },
            },

        },
    });



    const obterDados = () => {

        var mensagem = '';
        var percentual = 0;


        const endpoint = `/tentativa/buscarResultados/${idUsuario}`;
        fetch(endpoint)
            .then(res => res.json())
            .then(res => {


                valores[0] = res[res.length - 1].qtdAcertos;
                valores[1] = res[res.length - 1].qtdErros;
                msgKpis[0] = res[res.length - 1].qtdAcertos;
                msgKpis[1] = res[res.length - 1].qtdErros;
                msgKpis[2] = res[res.length - 1].qtdQuestoes;

                div_quest_certas.innerHTML = msgKpis[0];
                div_quest_erradas.innerHTML = msgKpis[1];
                div_qtd_Questoes.innerHTML = msgKpis[2];

                percentual = `${((msgKpis[0] / msgKpis[2]) * 100).toFixed()}%` ;

                tentativa = res.length;

                for (var i = 0; i < tentativa; i++) {
                    console.log(i);

                    rankingAcerto[i] = res[i].qtdAcertos;
                    rankingErros[i] = res[i].qtdErros;

                }

                for (let j = 0; j < rankingAcerto.length; j++) {
                    
                    mensagem += `<b>Tentativa ${j+1} </b><br>
                       Questões certas: ${rankingAcerto[j]} <br> Questões erradas: ${rankingErros[j]} <br><br>`;
                }


                div_ranking.innerHTML = mensagem;
                div_percentual.innerHTML = percentual;

                grafico1.update()
            })
            .catch(erro => {
                console.log("ERRO: " + erro)

            })


    }

    let intervalo = setTimeout(obterDados, 1000);

</script>
