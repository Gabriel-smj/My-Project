<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    // Função chamada ao carregar a página para obter e processar os dados
    function obterDados() {
        // Aqui seria a função que obteria os dados do banco de dados
        // No caso, aqui você colocaria o fetch que teria o endereço da sua rota que você criou na pasta /routes e chamaria a função plotarGraficoLinha nessa função. Exemplo:

        fetch('/obterDados')
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                plotarGraficoLinha(data);
                plotarGraficoBarra(data);
            })
            .catch(function (err) {
                console.log(err);
            })


        const endpoint = `/tentativa/buscar/`;

        fetch(endpoint)
            .then(res => res.json())
            .then(res => {
                valores[0] = res.acertos
                valores[1] = res.erros
                valores[2] = res.pontuacaoFinal
                grafico1.update()
            })
            .cat(erro => {
                console.log("ERRO: " + erro);

            })

        // Como eu não configurei as rotas, eu criei um array com os dados para simular a obtenção dos dados

        // Chamando a função para plotar o gráfico de linha com os dados
        plotarGraficoLinha();
        // Chamando a função para plotar o gráfico de barra com os dados
        plotarGraficoBarra()
    }

    function plotarGraficoLinha() {


        // Preenchendo os arrays com os dados
        // for (var i = 0; i < .length; i++) {
        //     votos.push([i].votos);
        //     jogadores.push([i].jogador);
        // }
        let nomeUsuario = sessionStorage.NOME_USUARIO

        const ctx = document.getElementById('myChart');

        let labelsX = ['Acertos', 'Erros', 'Pontuação'];
        let valores = [3, 6, 9];

        var grafico1 = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labelsX,
                datasets: [{
                    label: nomeUsuario,
                    data: valores,
                    borderWidth: 4,
                    bordeColor: 'rgba(77, 166, 253, 0.85)',
                    backgraoundColor: 'transparente',
                    color: '#4a006c'
                }]
            },
            options: {
                title: {
                    display: true,
                    fontSize: 20,
                    text: 'Relatório do Quiz'
                },
                labels: {
                    fontStyle: 'bold'
                },

            }
        });

    }
