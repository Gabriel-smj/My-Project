<body>

    <section id="login">
        <div class="login-container">
            <div class="box-login">

                <h1>LOGIN</h1>

                <label>
                    <span>E-mail:</span> <br>
                    <input type="text" id="input_email" placeholder=" Digite seu email...">
                </label>
                <label>
                    <span>Senha:</span> <br>
                    <input type="text" id="input_senha" placeholder=" Digite sua senha...">
                </label>

                <button onclick="autenticar()">Entrar</button>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/img/music-16628_256.gif" id="loading-gif">
                </div>

                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>

                <p>Não tem cadastro, <a href="cadastro.html">Cadastre-se</a></p>
            </div>
            <img src="assets/img/ChatGPT Image Nov 14, 2025, 01_20_07 AM.png" alt="">
        </div>
    </section>

        <p>Frequecy Culture &copy; Todos os direitos reservados</p>
    </footer>

</html>
<script>


    function autenticar() {
        aguardar();

        var emailVar = input_email.value;
        var senhaVar = input_senha.value;

        if (emailVar == "" || senhaVar == "") {

            cardErro.style.opacity = 1;

            mensagem_erro.innerHTML = "<p>Campos em brancos e/ou incorretos</p>";

            return false;
        }
        else {
            setInterval(sumirMensagem, 4000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario

                    cardErro.style.opacity = 1;

                    mensagem_erro.innerHTML =
                        "Login realizado com sucesso!";

                    div_aguardar.style.opacity = 1;

                    setTimeout(function () {

                        window.location = "Quizz/QUIZ.html";

                    }, 5000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.opacity = 0;
    }

</script>
